name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # NEXT_PUBLIC_* is inlined at build time. Both values are public:
          # the ElevenLabs agent-id is locked to the domain in the dashboard,
          # the lead endpoint is a public Cloudflare Worker URL.
          NEXT_PUBLIC_ELEVENLABS_AGENT_ID: agent_5801kt12qkk0exhr47yy5qm6anbz
          NEXT_PUBLIC_LEAD_ENDPOINT: https://aqly-lead.corieaerac.workers.dev
      - run: touch ./out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
